name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Compile Windows widget
        shell: powershell
        run: Add-Type -Path '.\Widget.cs' -ReferencedAssemblies 'System.Windows.Forms','System.Drawing','System.Web.Extensions' -OutputAssembly '.\CodexTokenWidget.ci.exe' -OutputType WindowsApplication
